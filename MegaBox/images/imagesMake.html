<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
.poster-box {
  width: 220px;
  height: 320px;
  background: linear-gradient(180deg, #a1c4fd 0%, #c2e9fb 60%, #e0c3fc 100%);
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
  font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
  box-sizing: border-box;
  position: relative;
  overflow: hidden;
  border: 3px solid #ffffff;
}

/* 상단 태그 및 등급 */
.poster-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.badge {
  background: #ff7675;
  color: white;
  font-size: 10px;
  font-weight: bold;
  padding: 4px 8px;
  border-radius: 12px;
}
.rating {
  background: #2ed573;
  color: white;
  font-size: 10px;
  font-weight: bold;
  padding: 2px 6px;
  border-radius: 4px;
}

/* 캐릭터 그래픽 영역 (이모지 활용) */
.character-area {
  position: relative;
  height: 110px;
  display: flex;
  justify-content: center;
  align-items: center;
}
.character {
  position: absolute;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1));
}
.character.main {
  font-size: 58px;
  z-index: 2;
  top: 15px;
}
.character.sub-left {
  font-size: 40px;
  left: 20px;
  top: 35px;
  transform: rotate(-15deg);
}
.character.sub-right {
  font-size: 40px;
  right: 20px;
  top: 35px;
  transform: rotate(15deg);
}

/* 타이틀 영역 */
.title-area {
  text-align: center;
  background: rgba(255, 255, 255, 0.6);
  padding: 10px 6px;
  border-radius: 12px;
  backdrop-filter: blur(4px);
}
.tag {
  font-size: 11px;
  color: #ff4757;
  font-weight: bold;
  display: block;
  margin-bottom: 2px;
}
.title {
  margin: 0;
  font-size: 17px;
  color: #2f3542;
  font-weight: 800;
  letter-spacing: -0.5px;
}
.subtitle {
  margin: 4px 0 0 0;
  font-size: 11px;
  color: #57606f;
}

/* 하단 개봉일 */
.poster-bottom {
  text-align: center;
  font-size: 11px;
  font-weight: bold;
  color: #ffffff;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}
</style>
</head>
<body>
    
   <div class="poster-box">
  <div class="poster-top">
    <span class="badge">NOW SHOWING</span>
    <span class="rating">ALL</span>
  </div>
  
  <div class="character-area">
    <div class="character main">🐻‍❄️</div>
    <div class="character sub-left">🐱</div>
    <div class="character sub-right">🐰</div>
  </div>

  <div class="title-area">
    <span class="tag">극장판</span>
    <h2 class="title">우당탕탕 시골 모험</h2>
    <p class="subtitle">~ 작은 친구들의 비밀 이야기 ~</p>
  </div>

  <div class="poster-bottom">
    <span>9월 30일 대개봉</span>
  </div>
</div>






</body>
</html>

<!DOCTYPE html>
<html lang="KO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2차원 배열</title>
</head>
<body>
    
    <script>
        // 2차원 배열 생성하느 3가지 방법

        // 자바스크립트에서 2차원 배열은 기본적으로 존재하지 않는다.
        // 다만, 2차원 배열처럼 생성할 수 있는 여러가지 방법이 존재한다.
        // 1. 초기값을 할당하여 배열 생성하는 방법
        // 아래 arr 배열은 3행 2열의 배열을 선언과 동시에 초기화 하였다.
        let arr = [['a','b'],  // 1행
                  ['c','d'],  // 2행
                  ['e','f']
        ];  // 3행
        // for문을 이용하여 콘솔에 출력한다.
        // 단, 다중 for문을 사용한다.
        for(let i = 0; i<arr.length; i++){  // 행의 루프 돌리기
            for(let j = 0; j<arr[i].length; j++){
                console.log(`arr의 출력 : ${arr[i][j]}`);
            }
        }
        // 2. new Array(행)을 이용하여 배열을 생성하는 방법
        let arr02 = new Array(2);  // 2행
        for(let i = 0; i<arr02.length; i++){
            arr02[i] = new Array(3);  // 3열 생성
            // 0이라는 값을 저장함
            for(let j = 0; j<arr02[i].length; j++){
                arr02[i][j] = 5;
            }
        }
        for(let i = 0; i<arr02.length; i++){
            for(let j = 0; j<arr02[i].length; j++){
                console.log(`${[i]}, ${[j]} : ${arr02[i][j]}`);
            }
        }

        // 3. ES6(자바스크립트 6버전)을 지원하는 모든 브라우저라면 사용가능한 방법
        // const arr1 = Array.from(Array(6),()=> new Array(7));
        // Array.from(Array(2),()=> new Array(3));
        // 6행의 7열 빈 배열 생성
        // const array03 = Array.from(Array(6),() => new Array(7));
         // fill(0) 을 하면 모든 값이 0이 들어간다.
        const array03 = Array.from(Array(6),() => new Array(7).fill(3)); 
        console.log(`array03을 출력 : ${array03}`);
        for(let i = 0; i<array03.length; i++){
            for(let j = 0; j<array03[i].length; j++){
                console.log(`${[i]}, ${[j]} : ${array03[i][j]}`);
            }
        }

        array03.forEach((value, index, array)=>{
            // console.log(`array03의 value : ${value}`);
            console.log(`array03의 index : ${index}`);
            // console.log(`array03의 array : ${array}`);
        });
        // forEach() 함수 : 배열 순회 전용 메소드로, 배열일때만 사용가능
        // forEach(value, index, array)
        // value : 값 / index : 인덱스 번호 / array : 배열 전체
        // 순서가 중요하다 
        // 배열이름.forEach((value, index, arr) => {....})
        // => () => {....} : 콜백 함수라 부른다.
        // call : 함수를 실행(호출)하라
        // back : 나중에, 또는 제어권을 넘겨 받은 
        // 직접함수() 형태로 실행되는게 아니라, 제어권을 넘겨받은 다른 함수가
        // 나중에 호출되도록 만드는 것

        //
        
        const tarray = [10, 20, 30];
        tarray.forEach((value, index, array)=>{
            console.log(`tarray의 value : ${value}`);
            console.log(`tarray의 value : ${index}`);
            console.log(`tarray의 value : ${array}`);
        });
        const tarray02 = [[10,10], [20,20], [30,30]];
        tarray02.forEach((value, index, array)=>{
            console.log(`tarray02의 value : ${value}`);
            console.log(`tarray02의 value : ${index}`);
            console.log(`tarray02의 value : ${array}`);
        });

        // 배열을 순회하면서 출력하는 메소드 : map
        // 단, 새로운 배열로 반환한다.
        // 반드시 return 값 이용하여 반환한다.
        // map()도 콜백함수이다.
        let tarray03 = [1,2,3];
        let doubled = tarray03.map((value,index,array)=>{
            // console.log(value);
            console.log(`tarray03 출력 : ${value}`);
            return value * 10;
        });
        // doubled=[10, 20, 30]; 의미이다.
        console.log(doubled);


    </script>


</body>
</html>

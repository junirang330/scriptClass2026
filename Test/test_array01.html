<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열(Array) 기초 설명</title>
</head>
<body>
    <script>
        // 1. 기본 배열 선언과 초기화 하기
        let fruits = ['사과','딸기','포도'];
        console.log(`fruits 출력 : ${fruits}`);

        // 2. numbers 배열에 1부터 5까지 숫자 넣고, 2번 값 출력하기
        let numbers = [1, 2, 3, 4, 5];
        console.log(`numbers의 2번 출력 : ${numbers[2]}`);
        // 배열의 데이터 타입은 object(객체)이다.
        console.log(`데이터 타입 number : ${typeof numbers}`);
        console.log(`데이터 타입 fruits : ${typeof fruits}`);
        
        // 3. 배열의 길이를 세는 property length
        // property는 () 괄호가 존재하지 않는다.
        // method는 반드시 () 괄호가 존재한다. (예 : pop())
        let names = ['Jason', 'Alice', 'Candy', 'Chris'];
        console.log(`names의 길이 : ${names.length}`);

        // 위의 numbers 배열을 이용하여 합계를 구하고 싶다. for문 이용
        let sum = 0;
        console.log(sum);
        for(let i = 0; i<numbers.length; i++){
            sum += numbers[i];
        }
        console.log(`numbers의 합계 : ${sum}`); 
        
        // 5. 혼합 배열 arr01 선언
        let arr01 = [10, 'Switch', '2026-09-28'];
        console.log(`arr01의 요소 출력 : ${arr01}`);
        console.log(typeof arr01);
        
        // 6. 배열 선언 두 번째 방식
        let arr03 = Array(50, 60, 70);
        console.log(`arr03의 요소 출력 : ${arr03}`);
        // 결과 : arr03의 요소 출력 : 50,60,70

        // 7. 배열 선언 세 번째 방식
        let arr04 = new Array(3);
        // 단, 현재 arr04 참조변수는 빈 값이다.
        console.log(`arr04의 요소 출력 : ${arr04}`);
        // 결과 : arr04의 요소 출력 : ,,
        // 3개 요소만 집어 넣을 수 있게, 개수만 선언하였기 때문이다.
        // 위와 같이 빈값인 경우, 자바스크립트는 아무것도 출력하지 않는다.
        
        // 8. 빈 배열을 출력하는 방식 fill() 메소드를 이용하여 값을 지정하는 방식
        // new Array(3).fill(0) : arr05의 3개 요소를 모두 0으로 채운다. 
        let arr05 = new Array(3).fill(" ");
        console.log(`arr05의 요소 출력 : ${arr05}`);
        // 결과 : arr05의 요소 출력 : 0,0,0

        // 문제: 위의 arr05의 000 -> 123 으로 바꿀것
        for(let i = 0; i<arr05.length; i++) {
            arr05[i] = (i+1);
        }
        console.log(`arr05의 요소를 1,2,3 으로 출력 : ${arr05}`);


        




    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열 Method</title>
</head>
<body>
    <script>
        // 자바스크립트의 Array(배열)의 각종 Method
        let ranking = ['Jason','Alice','Candy','Chris','Tom'];
        let arrTotal = ['korea',90,'2026-09-28'];
        // 메소드 하기 전
        console.log(`ranking 요소 : ${ranking}`);
        
        // 1. pop() : 맨 마지막 요소 삭제하고 반환한다.
        let poped = ranking.pop();
        console.log(`pop()한 요소 : ${poped}`);  // Tom 반환
        console.log(`pop()한 후 ranking 요소 : ${ranking}`);  // Tom 삭제되어 있음
        
        // 2. push(new data) : 배열의 맨 마지막에 새로운 데이터 추가
        ranking.push('David');  // 배열 맨 뒤에 David 추가됨
        console.log(`push()한 후 ranking 요소 : ${ranking}`);
        
        // 3. shift() : 배열의 맨 앞에 요소를 삭제하고 반환한다.
        let shift = ranking.shift();
        console.log(`shift()한 요소 : ${shift}`);  // Jason 반환
        console.log(`shift()한 후 ranking 요소 : ${ranking}`);  // Jason 삭제되어 있음
        
        // 4. unshift(new data) : 배열의 맨앞에 새로운 데이터 추가
        ranking.unshift('Emma');   // 배열 맨 앞에 Emma 추가됨
        console.log(`push()한 후 ranking 요소 : ${ranking}`);
        
        // 새로운 테스트를 위해 재할당한다.
        ranking = ['Jason','Alice','Candy','Chris','Tom'];
        console.log(`재할당한 ranking 요소 : ${ranking}`);
        
        // 5. 조인(연결할 문자) : 요소와 요소사이를 연결할 문자로 연결하여,
        // 문자열로 반환
        let joinString = ranking.join('ㅡ');
        console.log(`join()한 후 ranking 요소 : ${joinString}`);
        // 결과 : JasonㅡAliceㅡCandyㅡChrisㅡTom
        
        // 6. reverse() : 배열의 요소를 반대로 반환
        ranking.reverse();
        console.log(`reverse()한 후 ranking 요소 : ${ranking}`);
        // 결과 : Tom,Chris,Candy,Alice,Jason
        arrTotal.reverse();
        console.log(`reverse()한 후 arrTotal 요소 : ${arrTotal}`);
        // 결과 : 2026-09-28,90,korea
        
        // 7. sort() : 기본 오름차순 정렬됨
        ranking.sort();
        console.log(`sort()한 후 ranking 요소 : ${ranking}`);
        // 결과 : Alice,Candy,Chris,Jason,Tom
        arrTotal.sort()
        console.log(`sort()한 후 arrTotal 요소 : ${arrTotal}`);
        // 결과 : 2026-09-28,90,korea
        // 날짜 - 숫자 - 문자 순으로 정렬됨
        
        // 내림차순 : sort((a,b) => b-a)
        // 단, 배열의 요소가 숫자일 경우에만
        // 내림차순 sort((a,b) => b-a) 가능하다
        ranking = ['Jason','Alice','Candy','Chris','Tom'];
        ranking.sort((a,b) => b-a);
        console.log(`sort()한 후 ranking 요소 : ${ranking}`);
        // arrTotal.sort((a,b) => b-a)
        // console.log(`sort((a,b) => b-a)한 후 arrTotal 요소 : ${arrTotal}`);
        // 문자를 내림차순 하려면, sort() 하고 reverse 하면 문자 내림차순 가능하다.

        let number = [5,1,2,4,6];
        number.sort((a,b)=>b-a);
        console.log(`sort((a,b)=>b-a한 후 number 요소 : ${number}`);
    
        // 8. slice(start index, end index) : 시작 인덱스 번호, 끝 인덱스 번호 
        // slice : 자르다 (구간을 잘라서, 새 배열로 생성한다.
        // slice(1, 3) : 인덱스 1부터 ~ 인덱스 2까지만 정의된다.
        let sliceed = ranking.slice(1,3);
        console.log(`slice(1, 3) 요소 : ${sliceed}`); // Alice candy
        console.log(`slice(1, 3) 한 후 ranking 요소 : ${ranking}`);
        // 결과 : Jason,Alice,Candy,Chris,Tom

        // 9. splice(시작인덱스, 삭제할 개수, 아이템) : 특정 위치에 데이터 추가
        // 시작인 : 2, 삭제할 개수: 1, 아이템 : p
        // => 2위치에서 1개 삭제하고 p를 추가
        let spliced = ranking.splice(2,1,'pter');
        console.log(`splice(2,1,'pter')한 후 ranking 요소 : ${ranking}`);
        // 결과 : Jason,Alice,pter,Chris,Tom
        // replace와 동일한 기능

        // 10. concat() : 2개 요소를 하나의 배열로 합쳐서 새 배열로 생성(반환)
        let newRanking = ranking.concat('Sam', 'john');
        console.log(`concat() 한 newRanking 요소 : ${newRanking}`);
        // 결과 : Jason,Alice,pter,Chris,Tom,Sam,john
        console.log(`concat() 한 후 ranking 요소 : ${ranking}`);
        // 결과 : Jason,Alice,pter,Chris,Tom

        // 11. indexof() : 특정 요소의 인덱스 위치를 반환
        // 단, 없으면 -1 반환
        ranking = ['Jason','Alice','Candy','Chris','Tom'];
        let index = ranking.indexOf('Alice');
        console.log(`Alice의 인덱스 번호 : ${index}`);  // 1 반환 (1번 인덱스 값 반환)
        let index2 = ranking.indexOf('TomCare');
        console.log(`Alice의 인덱스 번호 : ${index2}`);  // -1 반환 (없으니까)
        
        // 12. includes() : 특정 값이 존재하면 true, 존재하지 않으면 false
        let hasTom = ranking.includes('Tom');
        let hasJake = ranking.includes('Jake');
        console.log(`includes('Tom')의 결과 : ${hasTom}`);  // true
        console.log(`includes('Jake')의 결과 : ${hasJake}`);  // false

        // 13. split('구분자') : 나열된 하나의 문자열을 지정한 구분자를 기준으로
                            //   쪼개서 배열로 생성하는 메소드이다.
        let test = '사과, 포도, 딸기';
        let result03 = test.split(',');
        console.log(`split 결과 : ${result03}`); 
    </script>
    
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object</title>
</head>
<body>
    
    <script>
        // 객체(Object) 가장 많이 사용하는 리터럴 방식으로 작성
        // 객체이름 = {key:value, key:value...}
        // 객체이름 = {property(속성) : 데이터1, property(속성) : 데이터2}
        let book = {
            title: 'javaScript',
            author: '홍길동',
            page: 500,
            price: 1500
        };
        // 객체 접근 방법 : 객체이름.property
        // ` `(빽틱) 또는 + (문자나열) 로 콘솔을 출력하는 경우는
        // 자바스크립트가 기본적으로 book.toString() 메소드 자동 호출한다.
        // 고로, 문자열로 나열된 상태이다.
        
        console.log(`book 객체 : ${book}`)  // [object Object]
        console.log(`book 객체 : ${book.title}`)  // javaScript
        console.log('book 객체 :' + book);  // [object Object]
        // 'book'객체 : ', book => 각각 독립된 상태로 콘솔출력됨
        console.log('book 객체 :', book);  // Object  ★★★★★★★★★★
        //{title: 'javaScript', author: '홍길동', page: 500, price: 1500}
        // author : "홍길동"
        // page : 500
        // price : 1500
        // title : "javaScript"
        // [[Prototype]] : Object

        // 2. 생성장 함수 이용해서 객체 생성하는 방법
        function Book01(title, author, page, price){
            this.title = title;
            this.author = author;
            this.page = page;
            this.price = price;
        }

        // 위의 this가 가리키는것
        // myBook.titlet = title;
        // myBook.author = title;
        // myBook.page = page;
        // myBook.proce = price;

        // 인스턴스화 한다.
        let myBook = new Book01('HTML', '개나리', 40, 15000);
        console.log('myBook :', myBook);

        // 객체의 property로 함수 가능하다.
        let Book02 = {
            title: 'CSS',
            author: '진달래',
            page: 30,
            price: 2500,
            info:function(){
                alert(`${this.title} 책의 분량은 ${this.page} 쪽입니다.`);
            }
        }
        console.log('Book02 :', Book02);
        Book02.info();
    </script>


</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>코어객체</title>
</head>
<body>
    <script>
        // 자바스크립트 객체 종류
        // 1. 코어 객체(Core/Built-in Object)
        //      => 자바스크립트에 내장된 객체이다.
        //      => Array, String, Date, Math(Math.random())
        // 2. DOM 객체(Document Object Model)
        //      => HTML의 요소들을 접근★하고 제어하기 위한 객체
        //      => document.getElementById(), querySelector()
        // 3. BOM 객체 (Browser Object Model)
        //      => 웹 브라우저 전체를 제어하는 객체
        //      => window, location, navigator, history

        let today = new Date();  // 코어 객체는 반드시 new로 생성한다.
        console.log(`today 오늘날짜 : ${today}`);
        // today 오늘날짜 : Wed Sep 30 2026 09:57:00 GMT+0900 (한국 표준시)
        console.log(typeof today);
        // object

        let oneDate = new Date(86400000);
        // 1초 = 1,000ms
        // 1분 = 60 * 1,000 = 60,000 ms
        // 1시간 = 60*60,000ms = 3,600,000 ms
        // 1일 = 24*3,600,000ms = 86,400,000 ms
        console.log(`oneDate : ${oneDate}`);
        // Date의 기본날짜 : 1970년 1월 1일
        // 86,400,000 더하면 1970년 1월 1일 + 1일 해서 => 1970년 1월 2일
        // oneDate : Fri Jan 02 1970 09:00:00 GMT+0900 (한국 표준시) - 한국표준시라서, 9시로 표시된다.

        // Date(인수) => 인수는 날짜와 시간을 문자열로 입력한다.
        let date01 = new Date('september 08,2026,14:10:00');
        console.log(`date01 출력 : ${date01}`); 
        // date01 출력 : Tue Sep 08 2026 14:10:00 GMT+0900 (한국 표준시)

        let date02 = new Date(`2026/09/08/14:10:00`);
        console.log(`date02 출력 : ${date02}`);
        // date02 출력 : Tue Sep 08 2026 14:10:00 GMT+0900 (한국 표준시)

        let date03 = new Date(2026,8);  // 연.월, 일 만 쓸때는 작은 따옴표 없어도 된다.
        console.log(`date03 출력 : ${date03}`);
        // date03 출력 : Tue Sep 01 2026 00:00:00 GMT+0900 (한국 표준시)
        // 자바스크립트에서 월은 0부터 11까지이다. (0: 1월 / 8: 9월)

        let date04 = new Date(2026,8,5);  // 연.월, 일 만 쓸때는 작은 따옴표 없어도 된다.
        console.log(`date04 출력 : ${date04}`);
        // date04 출력 : Sat Sep 05 2026 00:00:00 GMT+0900 (한국 표준시)
        // 시간이랑 요일까지 다 나온다.

        // Date객체를 생성한게 아니라, now()라는 메소드를 이용하여 now를 출력함
        let now = Date.now();
        console.log(`now 출력 : ${now/86400000/365}`);
        // now 출력 : 1790730677298
        // now 출력 : 56.78369904816717
        // 1970-1-1  + 56 => 2026-1-1
        // now() 메소드 => 1970-1-1 00:00:00 (UTC)부터 지금까지 전체시간을 의미함

        // getFullYear : 출력 / setFullYear : 수정
        let today02 = new Date();
        // 오늘날짜의 연도만 출력
        let year02 = today02.getFullYear();
        console.log(`today02의 연도 출력 : ${year02}`);
        // today02의 연도 출력 : 2026
        console.log(typeof year02);  // number 
        console.log(year02 + 1);  // 2027

        // setFullYear() => 년도 수정 => getFullYear()로 호출
        let today03 = new Date();
        today03.setFullYear(2001);
        let year03 = today03.getFullYear();
        console.log(`today03의 수정된 년도 : ${year03}`);
        // today03의 수정된 년도 : 2001

        // 오늘날짜의 월을 출력하고 싶을때
        let today04 = new Date();
        // 밑에 var로 입력되엇다. 
        month04 = today04.getMonth() + 1;  // +1 을 해야, 0부터 시작하니까, 9월이 나온다.
        console.log(`today04의 오늘날짜 : ${month04}`);  
        // today04의 오늘날짜 : 9
        console.log(typeof month04);  // number
        
        let day04 = today04.getDate();
        console.log(`today04의 오늘날 : ${day04}`);  // 1부터 ~ 31일까지니까, + 1 안해도 된다.
        // today04의 오늘날 : 30

        let weekDay04 = today04.getDay();  // 0 ~ 6까지 (0: 일요일 / 6: 토요일)
        console.log(`today04의 오늘요일 : ${weekDay04}`);
        // today04의 오늘요일 : 3 
        // 0 : 일요일  /  3: 수요일

        let today05 = new Date();
        let localToday = today05.toLocaleDateString();
        console.log(`today05의 localDateString 출력 : ${localToday}`);
        // today05의 localDateString 출력 : 2026. 9. 30.   (우리나라 날짜 형식으로 출력됨)
        let localTime = today05.toLocaleTimeString();
        console.log(`today05의 localTime 출력 : ${localTime}`);
        // today05의 localTime 출력 : 오전 10:47:39  (우리나라 시간 형식으로 출력됨)

        // 문제 : 오늘날짜의 요일을 월화수목금토일 형식으로 출력
        // 배열 생성 필요함
        let weekDay05 = today05.getDay().toString();
        let weekDay = ['일','월','화','수','목','금','토'];
        console.log(`today05의 오늘 요일을 출력 : ${weekDay[weekDay05]}요일`);
        // today05의 오늘 요일을 출력 : 수요일

        let today06 = new Date(2026,8,15);  // 9월 15일 -> 화요일
        let weekDay02 = today06.getDay();
        console.log(weekDay[weekDay02]);
        // 화

        // ------------------------------------------------------------------//
        // document.write() 는 웹 브라우저가 HTML문서를 로딩할 때,
        // 해당 위치의 원하는 텍스트, 또는 HTML 태그를 직접 출력해주는 메소드이다.
        let today07 = new Date();  
        let week01 = ['일','월','화','수','목','금','토'];
        let dayWeek = today07.getDay();

        // 태그끼리 연결없어도 바로 HTML에 출력가능하다
        document.write(today07.getFullYear()+'년도 </br>');
        document.write(today07.getMonth()+'월 </br>');
        document.write(today07.getDate()+'일 </br>');
        document.write(today07.getHours()+'시 </br>');
        document.write(today07.getMinutes()+'분 </br>');
        document.write(today07.getSeconds()+'초 </br>');

        document.write(week01[dayWeek]+'요일 </br>');
        



        


    </script>
</body>
</html>

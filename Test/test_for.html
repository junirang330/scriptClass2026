<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반복문:for</title>
</head>
<body>
    <h4>문제 1부터 10까지 가로로 나열</h4>
    <p id="print03"></p>
    <script>
        // while(조건문){ 실행문 } => 조건을 만족할때까지 실행
        let num = 0;
        while(num<=5){
            console.log(`num : ${num}`);
            num++;
            console.log(`num 누적 결과 : ${num}`);
        }

        // DO ~ while
        // DO{실행문} while(조건식);  => 무조건 한 번은 실해됨.
        // 조건을 만족하지 않아도, 무조건 한번 실행
        let count = 0;
        do{
            console.log(`무조건 한번은 출력~~`);
            count++;
            console.log(`count 누적 결과 : ${count}`);
        }while(count<3);

        console.log(`count의 끝 : ${count}`);

        // for 반복문
        // for문 : 조건이 만족할때까지 순회
        // const 키워드는 재항당자체가 안되기 때문에, 
        // 반복문에서는 사용할 수 없다.
        // 현재 i=0 => i++ => i=1
        // 위 재할당을, const는 불가 / let은 가능
        for(let i=0; i<10; i++){
            console.log(`반복 i : ${i}`);
        }

        // 1부터 10까지 출력
        // p태그
        // for문 이용
        let tmp = 1;
        let text = '';  // 현재 텍스트는 문자열 데이터 타입이다.
        let print = document.getElementById('print03');
        console.log(tmp);
       
        for(let i = 1; i<=10; i++) {
            console.log(tmp);
            text += "<strong>" + i+ " <strong>";
            console.log(text);
        }
        print.innerText = text;   // 태그 안에 텍스트 형식으로 넣어준다.
        print.innerHTML = text;    // Dom으로 지정한 변수의 태그안에 작성한 태그까지 넣어준다.

        

           

    </script>


</body>
</html>

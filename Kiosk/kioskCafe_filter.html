                    <button onclick="plus(${i})">+</button>
                    <button onclick="deletes(${i})">X</button>
                    </div> `; 
                tmp += price;
            }



            totalPrice += tmp;
            result += `</div></div></div>
                <div class = "bottom">
                <div class = "total">총 주문금액 : ${totalPrice.toLocaleString()}원</div>

                <span class = "cashPay">현금결제</span>
                </div>`;
            
            container.innerHTML = result;
            // coffee();

        }    

        // 메뉴 버튼 li 눌렀을때, 함수
        function add_orders(i){
            // let jangcnt = 0;
            // idxs.push(menus[i]);
            // 체크키
            let chk = -1;

            // let tmpCart = [];
            // tmpCart

            //반복문을 통해서, 기존에 상품있는지 확인하는 단계
            for(let j = 0; j<idxs.length; j++){
                if(menus[i].id == idxs[j].id){
                    chk = j;
                }
            }

            // chk = -1이면 상품이 장바구니 없으면
            // 추가
            // 동일한 상품이 없는 경우에는, 상품 신규 추가
            if(chk == -1){
                idxs.push(menus[i]);
            }else{ // chk가 -1이 아니면 수량만 1씩 증가
                idxs[chk].quantity ++;
            }

            render(index);
        }   
                  

        // 마이너스 함수
        function minus(i){
            // 1밑으로는 경고 메시지
            for(let j = 0; j<idxs.length; j++){
                if(idxs[j].quantity == 1){
                     alert("수량은 최소 1개 이상이어야 합니다");
                }else{
                    idxs[j].quantity--;
                }
            }
                
            render(index);
        }
        // 플러스 함수
        function plus(i){
            idxs[i].quantity++;
            render(index);
        }
        // 삭제 함수
        function deletes(i){
            idxs[i].quantity = 0;

            // 인덱스 배열에서도 삭제하기
            // idxs.splice(menus[i].id,1);        
            let idxTmp = -1;  // 임의의 인덱스 변수 
            for(let j = 0; j<idxs.length; j++){
                if(idxs[j]==i) {
                    idxTmp = j;  // idxs 배열의 인덱스 값 찾기
                    break;
                }
            }
            
            idxs.splice(idxTmp,1);  // 찾은 인덱스값 배열에서 삭제하기
            console.log(`idxs : ${idxs}`);
            render(index);
        }
        function reset(){
            for(let i = 0; i<idxs.length; i++) {
                idxs[i].quantity = 0;
            }

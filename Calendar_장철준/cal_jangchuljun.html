<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calendar_jang.css">
</head>
<body>
    <div id="main">

    </div>
    <script>
        let main = document.getElementById('main');
        let month_dif = 0; // 오늘 날짜와 화면에 그려낼 달의 차이값
        
        
        function display(){
            let today = new Date(); // 오늘날짜
            let prtMonth = new Date(); // 화면에 그려낼 달
            // let startWeek = new Date(prtMonth); // 처음날짜 요일
            let startWeek = 0; // 처음날짜 요일
            let lastDay = 0 ; // 마지막 날짜
            let weekday = ['SUN','MON','TUE','WED','THU','FRI','SAT']; // 일 ~ 토 <배열> 
            let calendar = Array.from(Array(7), () => new Array(7).fill('0')); // 달력 출력용 빈 배열
            let result = ''; // 출력용 변수
            

            prtMonth.setDate(1);
            prtMonth.setMonth(today.getMonth() + month_dif);
            lastDay = prtMonth.getMonth() == 0 || prtMonth.getMonth() == 2 || prtMonth.getMonth() == 4 || prtMonth.getMonth() == 6 || 
                                                prtMonth.getMonth() == 7 || prtMonth.getMonth() == 9 || prtMonth.getMonth() == 11 ? 31 :
                        prtMonth.getMonth() != 1 ? 30 :
                        prtMonth.getFullYear() % 400 == 0 ? 29 :
                        prtMonth.getFullYear() % 100 == 0 ? 28 :
                        prtMonth.getFullYear() % 4 == 0 ? 29 : 28;

            console.log(`prtMonth.getMonth() : ${prtMonth.getMonth()}`);

            // startWeek
            startWeek = prtMonth.getDay();
            result += `<div class="container"><table><tr>`;

            let year = prtMonth.getFullYear();
            let month = prtMonth.getMonth();


            console.log(`prtMonth.getMonth() : ${prtMonth.getMonth()}`);
            console.log(`lastDay : ${lastDay}`);
            console.log('첫요일 계산 날 ' +startWeek);

            // let month = new Date(today);
            // 상단에 버튼 2개와 연도/달 표시 하는 단계
            result += `<div class = "head"><button onclick = "minus()">&lt</button> 
                       ${year}년${month+1}월
                       <button onclick = "plus()">&gt</button></div>`;
                
            let num = 1;
            let tomo

            // 6줄인지 5줄인지 확인하는 방법
            console.log(`길이 계산 : ${calendar.length}`);
            console.log(`길이 계산 : ${prtMonth.getDay()}`);
            console.log(startWeek);
            // startWeek=5 && lastDay=31 || startWeek=6 && lastDay>=30 ?  
            // 날짜 그리기
            for(let i = 0; i<calendar.length; i++){
                result += `<tr>`;
                for(let j = 0; j<calendar[i].length; j++){
                    let span_weekend = j == 0 ? `class='sunday'` :
                                        j == 6 ? `class='saterday'` : '';
                    if(i==0){
                        result += `<th ${span_weekend}>${weekday[j]}</th>`;
                    }else if(i==1 && j<startWeek){
                        result += `<td ${span_weekend}></td>`;
                    }else if(num<=lastDay){
                        calendar[i][j] = ' ';
                        calendar[i][j]= num;
                        
                        let isPastDay = today.getFullYear > prtMonth.getFullYear ? : ;
                        if((prtMonth.getMonth()==today.getMonth()) && (num ==today.getDate())) {
                           
                            console.log(`today.getDate() 출력 : ${today}`);
                            
                        }else{
                            result += `<td ${span_weekend}>${calendar[i][j]}</td>`;

                        }
                        
                        num ++;
                        
                        console.log(calendar[i][j]);
                    }else{
                        result += `<td></td>`;
                    }
                }
                result += `</tr>`;
                if(num > lastDay) break;
            }

            result += `</table></div>`;
            main.innerHTML = result;
        }
        
        function minus(){
            month_dif --;
            display();
        }
        function plus(){
            month_dif ++;
            display();
        }


        display();
    </script>
</body>
</html>

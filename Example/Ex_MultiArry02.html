    <script>

        // 선생님이 푸신 답
        // 문제 3: 4행, 4열 짝수는 0, 홀수 1
        // 다중 forEach
        let arr03 = Array.from(Array(4),()=> new Array(4).fill(0));
        arr03.forEach((rowValue)=>{
            rowValue.forEach((coValue, index)=> {
                // 삼항연산자
                rowValue[index] = index % 2 == 0? 1:0;
          })
          //콘솔 출력
          console.log(rowValue);
        });
        console.log(arr03);

        // map으로 하는 방법
        const resultArr03 = arr03.map((rowV)=>{

            return rowV.map((coV,ind)=>{
                return ind % 2 == 0 ? '1': '0';
            })
            console.log(`rowV 값 : ${rowV}`);
        });
        console.log(resultArr03);


        // 배열 생성단계
        let arr06 =[
            [1,2,3],
            [4,5,6]
        ];



        // 출력하는 단계
        // console.log(arr06);
        let sum = 0;  // 합계 쌓이는 변수
        for(let i = 0; i<arr06.length; i++){
            for(let j = 0; j<arr06[i].length; j++){
                sum += arr06[i][j];
                // console.log(sum);
            }
        }
        console.log(`배열의 합계 : ${sum}`);
           
    
        
    </script>

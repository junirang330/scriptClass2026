<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실습예제03</title>
    <style>
        table{
            border-collapse: collapse;
            border : 1px solid lightgray;
            width : 300px;
            height: 300px;
        }
        td{
            border: 1px solid lightgray;
            text-align: center;
        }
        span{
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h2>3. 달력 만들기(6X7)</h2>
    <div id = "output"></div>

    <script>
        let output = document.getElementById('output');
        // 배열 생성단계
        const arr = Array.from(Array(6),()=>new Array(7).fill(' '));
        const weekdays = ['일','월','화','수','목','금','토'];
        function render(){
            let result = `<table><tr>`;
            //첫행 먼저 반복문으로 그리기
            //  result += `<tr><td>${weekdays[i]}</td></tr>`;
            for(let j = 0; j<1; j++){
                result += `<tr>`;
                for(let i = 0; i<7; i++){
                    result += `<td><span>${weekdays[i][j]}</span></td>`;
                }
                result += `</tr>`;
            }
            let num = 0;

            for(let i = 0; i<arr.length-1; i++){
                result += `<tr>`;
                for(let j = 0; j<arr[i].length; j++){
                    if(num<31){
                        num ++;
                        arr[i][j]= num;
                        console.log(arr[i][j]);
                        result += `<td>${arr[i][j]}</td>`;
                    }else{
                        result += `<td></td>`;
                    }
                    
                }
                result += `</tr>`;
            }
    
            result += `</table>`;
            output.innerHTML = result;    
        }
        
        render();
    </script>
</body>
</html>

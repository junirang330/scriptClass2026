<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>급여계산 연습문제</title>
</head>
<body>
     <h2>직원 근무시간 급여 계산</h2>
    <label for = "hours">근무 시간 입력:</label>
    <input type = "number" id="hours" placeholder = "근무 시간 입력"/>
    <button onclick="salary()">급여 계산</button>
    <p id= "salaryR"></p>
    <p id = "workmsg"></p>
    <p id = "paymsg "></p>
    <script>
        // let pay = 10000;  // 기본시급 10000원
        let hour = document.getElementById('hours');
        let salaryR = document.getElementById('salaryR');
        let workmsg = document.getElementById('workmsg');
        let paymsg = document.getElementById('paymsg');

        function salary(){
            let workHour = Number(hours.value);
            let hourDefault = 10000;

            let payment;
            if(workHour<=8){
                payment = workHour * hourDefault;
            }else{
                //초과근무
                payment = (8*hourDefault) + (workHour-8)*(hourDefault*1.5);
            }
            salaryR.innerText = `급여: ${payment}원`;

            //근무 메시지
            switch(true){
                case workHour==0 : workmsg.innerText = "출근하지 않았습니다."; break;
                case workHour<=8 : workmsg.innerText = "정상 근무"; break;
                case workHour>8 : workmsg.innerText = "초과 근무"; break;
            }
            
            // 삼항 연산자
            paymsg.innerText = workHour == 0 ? '무급' : '급여 있음'; 
            // paymsg.innerText = msg;

        }

    </script>
    
</body>
</html>

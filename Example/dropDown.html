<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문제3</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        li a{
            color: black;
            text-decoration: none;
        }
        .dropdown{
            position: relative;
            width: 500px;
            margin: 100px auto;
        }
        .dropdown-btn{
            position: absolute;
            background: none;
            border: none;
            font-size: 16px;
            width: 500px;
            margin: 100px auto;
            cursor: pointer;
            display: flex;
            align-items: baseline;
        }
        .arrow{
            font-size: 12px;
            transition: transform 0.3s;
        }
        .dropdown-menu{
            position: absolute;
            top: 140px;
            left: 10px;
            padding: 10px 15px;
            background-color: white;
            list-style: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            /* 화면에 메뉴가 보이지 않아야 하기 떄문에 */
            display: none;
        }
        .arrow.up{
            /* 180도 화살표 방향 바꾸기 */
            transform: rotate(180deg);
        }
        .dropdown-menu.show{
            display: block;
        }

        .dropdown-menu li{
            cursor: pointer;
            padding: 7px 0;
        }
        .dropdown-menu li:hover{
            color: #000;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="dropdown">
        <button class="dropdown-btn" id="dropdownBtn">
            고객센터 <span class="arrow">▼</span>
        </button>
        <ul class="dropdown-menu" id="dropdownMenu">
            <li><a href="#">공지사항</a></li>
            <li><a href="#">뉴스/이벤트</a></li>
            <li><a href="#">상품 리뷰</a></li>
            <li><a href="#">상품 문의</a></li>
            <li><a href="#">대량구매/도매문의</a></li>
            <li><a href="#">기타문의</a></li>
        </ul>
    </div>

    <script>
        let dropdownBtn = document.getElementById('dropdownBtn');
        let dropdownMenu = document.getElementById('dropdownMenu');
        let arrow = document.getElementsByClassName('arrow')[0];
    
   
        dropdownBtn.addEventListener('click', ()=>{
            // toggle
            dropdownMenu.classList.toggle('show');
            // 화살표 회전
            arrow.classList.toggle('up');
        });
        
        
    </script>
</body>
</html>

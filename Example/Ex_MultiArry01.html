<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2차원 기초 배열 문제</title>
</head>
<body>

    <script>
        // 배열 생성단계
        const arr = Array.from(Array(3),()=>new Array(3).fill(0));
        for(let i = 0; i<arr.length; i++){
            for(let j = 0; j<arr[i].length; j++){
                if(i==j) arr[i][j]=1;
                // console.log(`${[i]},${[j]} : ${arr[i][j]}`);
                // console.log(arr[i][j]);
            }
        }
        console.log(arr);

        // 배열 생성단계
        const arr2 = Array.from(Array(2),() =>new Array(4));
        let num = 0;
        for(let i = 0; i<arr2.length; i++){
            for(let j = 0; j<arr2[i].length; j++){
                
                num++;
                arr2[i][j] = num;
                // console.log(`${[i]},${[j]} : ${arr2[i][j]}`);
                // console.log(arr2[i][j]);
            }
        }
        console.log(arr2);
    </script>
    
</body>
</html>

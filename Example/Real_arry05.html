<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실습예제 05</title>
    <style>
        /* .group{
            display : flex;
            justify-content: center;
            align-items: center;
            width: 200px;
        } */

    </style>
</head>
<body>
    <h2>실시간 재고 관리</h2>
    <div id = "output"></div>
    
    <script>
        // 상품, 재고자료를 배열로 생성
        //                0       1        2
        let product = ['노트북','마우스','키보드'];
        let stock = [3, 3, 2];
        let output = document.getElementById('output');

        // render() 함수를 생성
        // render() 함수안에 HTML 화면그리는 기능 작성할 것
        function render(){
            let result = '';  // 태그들을 저장하는 변수
            let total = 0;  // 총개수 구하는 변수
            // 반복문을 이용하여 product, stock에 HTML을 그린다.
            for(let i = 0; i<product.length; i++){
                result += `<div class = 'row'>${product[i]} :
                          <span>${stock[i]}</span>
                          <button onclick="minus(${i})">-</button>  
                          <button onclick="plus(${i})">+</button></div>`;  // 매개변수 ${i}★★★★★★★
                total += stock[i];
            }
            result += `<div>총 재고 : ${total}개 </div>`;
            output.innerHTML = result;
        }

        function minus(i){  // ★★★★★★★  i : 매개변수
            // 재고수량이 0보다 클때만 마이너스 된다.
            if(stock[i]>0){
                stock[i]--;
            }else{
                alert('재고수량 0미만으로는 선택 불가');
            }
            console.log(stock);  // 메모리에서는 마이너스 계산됨 (단, 화면은 업데이트가 안됨)
            // html 화면을 다시 글야 한다.
            render();
           
        }
        function plus(i){
            // 플러스 버튼은 최대 제한 없음
            stock[i]++;
            render();
        }

        // 처음 스크립트를 실행하면 화면을 그려야하기 때문에, 반드시 render() 호출
        // render : 다시 그려라
        render();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for 연습문제</title>
</head>
<body>
    <!-- 문제 : input 태그에서 입력한 숫자에 해당하는
         합계를 구하여, p태그에 출력하시오.
         단, 무조건 1부터 합계를 구하시오. 
         for 반복문 사용
    -->
    <label for="number">숫자를 입력하시오</label>     
    <input id = "number" type="number"/>
    <button onclick="calcSum()">확인</button>
    <p id="result"></p>

    <script>
        let sum = 0;
        let result = document.getElementById('result');
        let num = document.getElementById('number');
        // console.log(sum);
        // console.log(num);

        function calcSum(){
            let num01 = Number(num.value);
            // console.log(num);
            for(let i = 1; i<=num01; i++){
                sum += i;
                console.log(`1부터 ${i}까지의 합계 : ${sum}`);
            }
            result.innerText = `1부터 ${num01}까지 합계: ${sum}`;
            sum = 0;
        }

    </script>   
</body>
</html>

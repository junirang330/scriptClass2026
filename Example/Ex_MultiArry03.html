<body>
    
    <script>
        // 배열 생성단계
        let arr06 = [
            [1,2,3],
            [4,5,6]
        ];
       
        // 출력 단계
        for(let i = 0; i<arr06.length; i++){
             let sum1 = 0;  // 배열1의 합계 담을 변수
            for(let j = 0; j<arr06[i].length; j++){
                // sum2 += arr06[1][j];
                // sum1 += arr06[i][j];
                // sum2 += arr06[i][j];
                sum1 += arr06[i][j];
                // sum2 += arr06[i][j];
            }
            // console.log(arr06[i][j]);
            console.log(`배열의 행의 합계 : ${sum1}`);
        }
        // consoles.log(`배열의 햅의 합계 : ${sum2}`);

       
        // 6번 문제
        // 배열 생성
        let arr07 = [
            [3,9,2],
            [8,7,6],
            [1,4,5]
        ];
        let tmp = 0;  // 임시 값 지정
        // 출력단계
        for(let i = 0; i<arr07.length; i++){
            for(let j = 0; j<arr07[i].length; j++){
                if(arr07[i][j]>tmp){
                    tmp = arr07[i][j];
                    // console.log(arr[i][j]);
                }
            }
        }
        console.log(`최대값 : ${tmp}`);
    </script>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실습예제02</title>
    <style>

    </style>
</head>
<body>
    <h2>2.성적표(총점과 평균 계산)</h2>
    <div id="output"></div>
    <script>
        let output = document.getElementById('output');
        // 배열 생성단계
        let scores = [
            [85,90,80],
            [70,60,75],
            [95,100,90]
        ];
        //render() 사용
        function render(){
            let result = ''; // 결과값 누적할 변수
            let total = 0;
            let average = 0;
            let count = 0;

            for(let i = 0; i<scores.length; i++){
                total = 0;
                for(let j = 0; j<scores[i].length; j++){
                    total += scores[i][j];
                    // console.log(total);
                    count ++;
                }
                average = total / count;
                result += `학생 ${[i+1]} : ${scores[i]} ｜ 총점 : ${total} 
                        &nbsp; &nbsp; 평균 : ${average.toFixed(2)} </br>`;
                // console.log(`배열의 행의 합계 : ${total}`);
            }

            output.innerHTML = result;

        }

        render();

    </script>
</body>
</html>
